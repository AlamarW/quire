[project]
name = "quire"
version = "0.1.0"
description = "Shared foundations for terminal writing tools: editor resolution, storage, and revision history"
readme = "README.md"
authors = [{ name = "Austin Wiggins", email = "Austinlamarwiggins@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
